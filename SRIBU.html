<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budi & Sri | Wedding</title>

    <link <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9e9e9;
        }

        .untuk {
            font-family: 'Dancing Script', cursive;
            font-size: 200%;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            color: #536b58;
            margin: 15px 10px;
            padding: 0 10px;
            letter-spacing: 0.5px;
        }

        .cover {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            position: relative;
            background-image:
                linear-gradient(rgba(80, 65, 60, .38),
                    rgba(80, 65, 60, .48)),
                url("foto/cover.jpg");
            background-size: cover;
            background-position: center;
        }

        .cover-content {
            text-align: center;
            color: white;
            padding: 50px 25px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(255, 255, 255, .65);
            border-radius: 180px 180px 25px 25px;
            background: rgba(255, 240, 238, .10);
            backdrop-filter: blur(3px);
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(65px, 16vw, 100px);
            line-height: .85;
            font-weight: 400;
        }

        .and {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            color: #d7e2c9;
            margin: 20px 0;
        }

        .date {
            margin: 35px 0 12px;
            letter-spacing: 3px;
            font-size: 12px;
        }

        .message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-style: italic;
            margin-bottom: 30px;
        }

        .guest {
            font-size: 11px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: #8da17d;
            padding: 15px 28px;
            border-radius: 50px;
            font-size: 11px;
            letter-spacing: 1.5px;
            transition: .3s;
        }

        .btn:hover {
            background: #718864;
            transform: translateY(-3px);
        }

        .ornament {
            font-size: 30px;
            color: #eac6ca;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <section class="cover">

        <div class="cover-content">

            <div class="subtitle">THE WEDDING OF</div>

            <div class="ornament">❦</div>

            <h1>BUDI</h1>

            <div class="and">&</div>

            <h1>SUCJI</h1>

            <div class="date">SAVE THE DATE</div>

            <p class="message">
                Two hearts, one beautiful journey.
            </p>

            <p class="guest">
                Kepada Bapak/Ibu/Saudara/i
            </p>

            <h3 class="untuk">
                Sangker Dubels
            </h3>
            <br>

            <a href="Isi.html" class="btn">
                ✿ &nbsp; BUKA UNDANGAN
            </a>

        </div>

    </section>

</body>

</html>
